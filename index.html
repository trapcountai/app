<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fly counts, visits and reports for pest control teams.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TrapCount AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TrapCount AI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#006B4A">
  <style>
    /* Shown while the app downloads; removed on Flutter's first frame. */
    html, body { margin: 0; height: 100%; background: #F7F8FA; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F1412; } }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #5B6270;
      transition: opacity 220ms cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .mark {
      position: relative; width: 88px; height: 88px; border-radius: 26px; background: #fff;
      display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0, 107, 74, 0.16);
    }
    #boot .mark img { width: 64px; height: 64px; }
    #boot .mark::after {
      content: ""; position: absolute; inset: -10px; border-radius: 34px;
      border: 2px solid #3DBE8B; opacity: 0;
      animation: boot-ring 1600ms cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
    }
    #boot .bar { width: 140px; height: 3px; border-radius: 3px; background: #E3E5EE; overflow: hidden; }
    #boot .bar i {
      display: block; width: 40%; height: 100%; border-radius: 3px; background: #006B4A;
      animation: boot-bar 1200ms cubic-bezier(0.645, 0.045, 0.355, 1) infinite;
    }
    @keyframes boot-ring { 0% { opacity: .7; transform: scale(.94); } 100% { opacity: 0; transform: scale(1.12); } }
    @keyframes boot-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #boot, #boot .mark::after, #boot .bar i { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="Loading TrapCount AI">
    <div class="mark"><img src="icons/Icon-192.png" alt=""></div>
    <div>TrapCount AI</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
